[project]
name = "satellite-data-downloader"
version = "2.0.0"
description = "Windowed satellite mosaics and quality-aware pixel timeseries"
requires-python = ">=3.12,<3.15"
dependencies = [
  "streamlit>=1.55,<2",
  "folium>=0.20,<1",
  "streamlit-folium>=0.26.2,<1",
  "geopandas>=1.1.3,<2",
  "shapely>=2.1.2,<3",
  "numpy>=2.4.3,<3",
  "pandas>=2.3.3,<3",
  "rasterio>=1.5,<2",
  "pystac-client>=0.9,<0.10",
  "pyproj>=3.7.2,<4",
  "requests>=2.32.5,<3",
  "urllib3>=2.6.3,<3",
  "boto3>=1.42,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
